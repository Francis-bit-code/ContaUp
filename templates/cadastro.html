{% extends 'base.html' %}

{% block titulo %}Cadastro - ContaUP{% endblock %}

{% block conteudo %}
<section class='auth-card'>
    <div class='auth-logo'>
        <img src='{{ url_for('static', filename='img/logo_horizontal.png') }}' alt='Logo ContaUP'>
    </div>

    <div class='auth-text'>
        <h1>Crie sua conta</h1>
        <p>As categorias básicas já serão criadas para facilitar seu primeiro uso.</p>
    </div>

    <form class='auth-form' method='POST' action='{{ url_for('auth.cadastro') }}'>
        <div class='form-group'>
            <label for='nome'>Nome</label>
            <input type='text' id='nome' name='nome' placeholder='Digite seu nome' required>
        </div>

        <div class='form-group'>
            <label for='email'>E-mail</label>
            <input type='email' id='email' name='email' placeholder='Digite seu e-mail' required>
        </div>

        <div class='form-group'>
            <label for='senha'>Senha</label>
            <input type='password' id='senha' name='senha' placeholder='Crie uma senha' required>
        </div>

        <div class='form-group'>
            <label for='confirmar'>Confirmar senha</label>
            <input type='password' id='confirmar' name='confirmar' placeholder='Confirme sua senha' required>
        </div>

        <button class='btn-primary' type='submit'>Criar conta</button>
    </form>

    <div class='auth-footer'>
        <p>Já possui cadastro?</p>
        <a href='{{ url_for('auth.login') }}'>Voltar para login</a>
    </div>
</section>
{% endblock %}
